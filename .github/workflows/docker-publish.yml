name: Build and Publish Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile scripts/clamav_entrypoint.py scripts/clamav_ui_server.py scripts/clamd_session_scan.py scripts/scan_list_filter.py scripts/clamav_healthcheck.py scripts/event_writer.py scripts/scan_root_guard.py scripts/checkpoint_state.py tests/integration_clamd.py
          sh -n scripts/clamav_scheduled.sh

      - name: Test enumeration status handling
        run: sh tests/test_enumeration.sh

      - name: Check browser JavaScript
        run: node --check ui/app.js

      - name: Validate Compose example
        run: docker compose -f docker-compose.example.yml config --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        run: docker build --tag clamav-scheduled:test .

      - name: Smoke-test image tools
        run: |
          docker run --rm --entrypoint clamd clamav-scheduled:test --version | grep -E '^ClamAV 1\.4\.5($|/)'
          docker run --rm --entrypoint ffprobe clamav-scheduled:test -version
          docker run --rm --entrypoint id clamav-scheduled:test -u | grep -qx 10001
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=2g --entrypoint python3 clamav-scheduled:test -c 'import ast, pathlib; [ast.parse(pathlib.Path(path).read_text(encoding="utf-8")) for path in ("/usr/local/bin/clamav_entrypoint.py", "/usr/local/bin/clamav_ui_server.py", "/usr/local/bin/clamd_session_scan.py", "/usr/local/bin/scan_list_filter.py", "/usr/local/bin/enumerate_scan_files.py", "/usr/local/bin/clamav_healthcheck.py")]'

      - name: Run amd64 clamd integration test
        run: docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=2g --mount type=bind,src="${GITHUB_WORKSPACE}",dst=/workspace,readonly --entrypoint python3 clamav-scheduled:test /workspace/tests/integration_clamd.py

      - name: Scan amd64 image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: clamav-scheduled:test
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os
          scanners: vuln
          severity: HIGH,CRITICAL

      - name: Build arm64 validation image
        run: docker buildx build --platform linux/arm64 --load --tag clamav-scheduled:test-arm64 .

      - name: Run arm64 clamd integration test under QEMU
        run: docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=2g --mount type=bind,src="${GITHUB_WORKSPACE}",dst=/workspace,readonly --entrypoint python3 clamav-scheduled:test-arm64 /workspace/tests/integration_clamd.py

  docker:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/clamav-scheduled
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
