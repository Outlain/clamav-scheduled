services:
  clamav-scheduled:
    image: ghcr.io/${GITHUB_OWNER:-outlain}/clamav-scheduled:${IMAGE_TAG:-latest}
    container_name: clamav-scheduled
    user: "${SCANNER_UID:-10001}:${SCANNER_GID:-10001}"
    init: true
    restart: unless-stopped
    read_only: true
    stop_grace_period: 30s
    cpus: "2.0"
    mem_limit: 6g
    pids_limit: 256
    ports:
      # The UI has no authentication; expose it only on the Docker host by default.
      - "127.0.0.1:${UI_HOST_PORT:-8080}:8080"
    environment:
      APP_MODE: ${APP_MODE:-ui}
      UI_BIND: 0.0.0.0
      UI_PORT: 8080
      CONFIG_DIR: /config
      STATE_DIR: /state
      EVENT_DIR: /events
      RUNTIME_DIR: /tmp/clamav-runtime
      UI_MAX_REQUEST_THREADS: 32
      UI_REQUEST_QUEUE_SIZE: 64
      UI_REQUEST_TIMEOUT_SECONDS: 15
      DEFINITIONS_DIR: /var/lib/clamav
      DEFINITIONS_WAIT_TIMEOUT: 300
      DEFINITIONS_MAX_AGE_SECONDS: ${DEFINITIONS_MAX_AGE_SECONDS:-172800}
      DEFINITIONS_STALE_ACTION: fail
      CLAMD_MAX_QUEUE: 26
      CLAMD_MAX_SCAN_SIZE: 512M
      CLAMD_MAX_FILE_SIZE: 256M
      CLAMD_LOG_MAX_SIZE: 10M
      CLAMD_MAX_RECURSION: 32
      CLAMD_MAX_FILES: 10000
      CLAMD_MAX_SCAN_TIME: 900000
      CLAMD_READ_TIMEOUT: 900
      CLAMD_COMMAND_READ_TIMEOUT: 30
      CLAMD_SELF_CHECK: ${CLAMD_SELF_CHECK:-300}
      CLAMD_START_TIMEOUT: 180
      MAX_SCHEDULED_FILES: 1000000
      SCANLOG_MAX_BYTES: 104857600
      SCANLOG_ROTATIONS: 5
      VANISHED_FILE_FAILURE_COUNT: ${VANISHED_FILE_FAILURE_COUNT:-100}
      VANISHED_FILE_FAILURE_PERCENT: ${VANISHED_FILE_FAILURE_PERCENT:-10}
      VANISHED_FILE_FAILURE_MINIMUM: ${VANISHED_FILE_FAILURE_MINIMUM:-10}
      # These scanner settings are used directly in headless mode. In UI mode,
      # configure their equivalents in the UI after first launch.
      TZ: UTC
      MAXTHREADS: 13
      SCAN_PATHS: /downloads
      EXCLUDE_PATHS: /downloads/private:/downloads/tmp:/downloads/docker
      FULL_SCAN_PARALLEL_JOBS: 8
      CHANGED_SCAN_PARALLEL_JOBS: 8
      FULL_PROGRESS_STEPS: 100
      CHANGED_PROGRESS_STEPS: 25
      CHANGED_SCAN_DAYS: mon,tue,wed,thu,fri,sat,sun
      CHANGED_SCAN_TIMES: 01:00,13:00
      FULL_SCAN_DAYS: sun
      FULL_SCAN_TIMES: 03:30
      SCAN_FAILURE_RETRY_INTERVAL: 300
      FORCE_FULL_POLL_INTERVAL: 60
      PATH_CHECK_TIMEOUT: 10
      PATH_ENUMERATION_TIMEOUT: 300
      PATH_UNAVAILABLE_RETRY_INTERVAL: 300
      SCAN_PATH_MARKER: ${SCAN_PATH_MARKER:-}
      QUARANTINE_DIR: /quarantine
      SCANLOG: /var/log/clamav/clamav_scheduled.log
      FORCE_FULL_FLAG: /state/force_full_scan.flag
    volumes:
      - /mnt/media:/downloads:rw
      - /opt/docker/clamav-scheduled/config:/config:rw
      - /opt/docker/clamav-shared/defs:/var/lib/clamav:ro
      - /opt/docker/clamav-shared/logs/clamav-scheduled:/var/log/clamav:rw
      - /opt/docker/clamav-shared/events/clamav-scheduled:/events:rw
      - /opt/docker/clamav-shared/state/clamav-scheduled:/state:rw
      - /opt/docker/clamav-shared/quarantine/clamav-scheduled:/quarantine:rw
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=2g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
